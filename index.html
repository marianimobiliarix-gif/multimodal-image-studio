<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Gemini Multimodal Image Studio</title>
    <meta name="description" content="A powerful AI-driven image generation and editing tool that uses Gemini 2.5 Flash to transform source images with custom prompts and artistic styles." />
    <meta property="og:title" content="Gemini Multimodal Image Studio" />
    <meta property="og:description" content="A powerful AI-driven image generation and editing tool that uses Gemini 2.5 Flash to transform source images with custom prompts and artistic styles." />

    <!-- PWA Settings & Mobile Web App Meta -->
    <meta name="theme-color" content="#4f46e5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gemini Studio" />

    <!-- Icons & Manifest -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/index.css" />

    <style>
      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #f1f5f9; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>

    <!-- Safe Service Worker Registration for PWA & Preview -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          // If in an iframe (e.g. AI Studio development preview), unregister stale workers so preview is immediate
          if (window.self !== window.top) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              for (var i = 0; i < registrations.length; i++) {
                registrations[i].unregister();
              }
            });
          } else {
            navigator.serviceWorker.register('/sw.js').catch(function(err) {
              console.warn('SW registration skipped:', err);
            });
          }
        });
      }
    </script>

    <!-- ESM Importmap fallback for browser modules -->
    <script type="importmap">
    {
      "imports": {
        "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
        "react/": "https://esm.sh/react@^19.2.4/",
        "react": "https://esm.sh/react@^19.2.4",
        "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
        "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
      }
    }
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
